<style>
/* Layout: one-screen floodlit arcade — header strip, portrait pitch canvas, two big shoulder buttons */
:root{
  --night:#08140f; --panel:#11231a; --edge:#27443a;
  --grass:#14402a; --grass2:#174a31; --chalk:#d8e8d2;
  --sodium:#ffc95c; --mate:#6fd3ff; --opp:#ff6a5c; --good:#7ee08a;
  --ink:#eef4ea; --muted:#93ab9c;
  --display:'Barlow Condensed','Arial Narrow',sans-serif;
  --body:'Barlow',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--body);margin:0;-webkit-tap-highlight-color:transparent}
.app{height:100%;box-sizing:border-box;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:800;font-size:32px;letter-spacing:.08em;margin:0;line-height:1;text-transform:uppercase}
h1 span{color:var(--sodium)}
.sel{display:flex;gap:6px}
select{background:var(--panel);color:var(--ink);border:1px solid var(--edge);border-radius:6px;padding:6px 8px;font:600 13px var(--body)}
select:focus-visible,button:focus-visible{outline:2px solid var(--sodium);outline-offset:2px}
.hud{display:flex;justify-content:space-between;font-family:var(--display);font-size:16px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;font-variant-numeric:tabular-nums}
.hud b{color:var(--ink);font-weight:600}
.stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
canvas{display:block;border-radius:12px;touch-action:none;box-shadow:0 0 0 1px var(--edge),0 20px 60px rgba(0,0,0,.5)}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sh{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);
  background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:16px 8px;cursor:pointer;touch-action:manipulation;user-select:none}
.sh:active,.sh.on{background:var(--sodium);color:#1d1606;border-color:var(--sodium)}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:rgba(8,20,15,.94);border:1px solid var(--edge);border-radius:14px;padding:20px;max-width:340px;width:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:12px}
.eyebrow{font-family:var(--display);color:var(--sodium);letter-spacing:.14em;text-transform:uppercase;font-size:14px}
.card h2{font-family:var(--display);font-size:44px;margin:0;line-height:.95;letter-spacing:.04em;text-transform:uppercase;text-wrap:balance}
.card ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;line-height:1.4;color:#d7e3d9}
.stats{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-variant-numeric:tabular-nums}
.stats dt{color:var(--muted)} .stats dd{margin:0;text-align:right;font-weight:700}
.big{font-family:var(--display);font-size:56px;font-weight:800;color:var(--sodium);line-height:1}
.primary{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.1em;text-transform:uppercase;background:var(--sodium);color:#1d1606;border:0;border-radius:10px;padding:14px;cursor:pointer}
.tip{margin:0;font-size:13px;color:var(--muted);line-height:1.4}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <header>
    <h1>Om<span>uz</span></h1>
    <div class="sel">
      <select id="lvl" aria-label="Level">
        <option value="easy" data-i="easy"></option>
        <option value="medium" data-i="medium"></option>
        <option value="hard" data-i="hard"></option>
      </select>
      <select id="lang" aria-label="Language">
        <option value="tr">TR</option><option value="de">DE</option><option value="en">EN</option><option value="fr">FR</option>
      </select>
    </div>
  </header>
  <div class="hud"><span><span data-i="round"></span> <b id="hRound">0/10</b></span><span><span data-i="score"></span> <b id="hScore">0</b></span></div>
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="overlay" id="ov">
      <div class="card">
        <div class="eyebrow" data-i="tag"></div>
        <h2 id="ovTitle">Omuz</h2>
        <ol id="how"><li data-i="how1"></li><li data-i="how2"></li><li data-i="how3"></li></ol>
        <div id="endBox" hidden>
          <div class="big" id="endScore">0</div>
          <dl class="stats" id="endStats"></dl>
        </div>
        <button class="primary" id="go" data-i="start"></button>
        <p class="tip" data-i="tip"></p>
      </div>
    </div>
  </div>
  <div class="controls">
    <button class="sh" id="bL">◀ <span data-i="left"></span></button>
    <button class="sh" id="bR"><span data-i="right"></span> ▶</button>
  </div>
</div>

<script>
const T={
tr:{tag:'Tarama · Önce bak, sonra oyna',how1:'Top sana geliyor. Arkan sisli, görmüyorsun.',how2:'◀ ▶ ile omzunun üstünden kısa bir bakış at. Top gelmeden hemen önce bakmak en çok puanı verir.',how3:'Top ayağına gelince ekran kararır. Hafızandan boştaki arkadaşına dokun.',start:'Başla',again:'Tekrar oyna',left:'Sol omuz',right:'Sağ omuz',round:'Top',score:'Puan',decide:'Pas! Boştaki arkadaşa dokun',good:'İsabetli pas',bad:'Pas kesildi',none:'Orada kimse yoktu',late:'Geç kaldın, top kaybı',ontime:'Zamanında bakış',both:'İki tarafa da baktın',noscan:'Hiç bakmadın',easy:'Kolay',medium:'Orta',hard:'Zor',acc:'Doğru pas',scanr:'Top başına bakış',ontimer:'Zamanında bakış',best:'Rekor',end:'Antrenman bitti',newbest:'Yeni rekor!',tip:'Profesyoneller topu almadan hemen önce omzunun üstünden bakar.'},
de:{tag:'Scanning · Erst schauen, dann spielen',how1:'Der Ball kommt zu dir. Hinter dir ist Nebel.',how2:'Mit ◀ ▶ kurz über die Schulter schauen. Ein Blick kurz vor der Ballannahme bringt die meisten Punkte.',how3:'Kommt der Ball an, wird es dunkel. Tippe aus dem Gedächtnis auf den freien Mitspieler.',start:'Start',again:'Nochmal',left:'Linke Schulter',right:'Rechte Schulter',round:'Ball',score:'Punkte',decide:'Pass! Tippe auf den freien Mann',good:'Pass angekommen',bad:'Pass abgefangen',none:'Dort war niemand',late:'Zu spät, Ballverlust',ontime:'Blick zur rechten Zeit',both:'Beide Seiten gecheckt',noscan:'Kein Schulterblick',easy:'Leicht',medium:'Mittel',hard:'Schwer',acc:'Richtige Pässe',scanr:'Blicke pro Ball',ontimer:'Blick zur rechten Zeit',best:'Rekord',end:'Training beendet',newbest:'Neuer Rekord!',tip:'Profis schauen kurz vor der Ballannahme über die Schulter.'},
en:{tag:'Scanning · Look first, then play',how1:'The ball is coming to you. Behind you is fog.',how2:'Use ◀ ▶ for a quick shoulder check. Looking just before the ball arrives scores the most.',how3:'When the ball arrives the screen goes dark. Tap the free teammate from memory.',start:'Play',again:'Play again',left:'Left shoulder',right:'Right shoulder',round:'Ball',score:'Score',decide:'Pass! Tap the free teammate',good:'Pass completed',bad:'Pass intercepted',none:'Nobody was there',late:'Too late, ball lost',ontime:'Well-timed check',both:'Checked both sides',noscan:'No shoulder check',easy:'Easy',medium:'Medium',hard:'Hard',acc:'Correct passes',scanr:'Checks per ball',ontimer:'Well-timed checks',best:'Best',end:'Session over',newbest:'New best!',tip:'Pros check their shoulder right before they receive.'},
fr:{tag:'Scanning · Regarde, puis joue',how1:'Le ballon arrive vers toi. Derrière toi, c’est le brouillard.',how2:'Avec ◀ ▶, jette un coup d’œil par-dessus l’épaule. Regarder juste avant la réception rapporte le plus.',how3:'À la réception, l’écran s’assombrit. Touche de mémoire le coéquipier libre.',start:'Jouer',again:'Rejouer',left:'Épaule gauche',right:'Épaule droite',round:'Ballon',score:'Points',decide:'Passe ! Touche le joueur libre',good:'Passe réussie',bad:'Passe interceptée',none:'Personne à cet endroit',late:'Trop tard, ballon perdu',ontime:'Regard au bon moment',both:'Les deux côtés vérifiés',noscan:'Aucun regard',easy:'Facile',medium:'Moyen',hard:'Difficile',acc:'Passes réussies',scanr:'Regards par ballon',ontimer:'Regards au bon moment',best:'Record',end:'Séance terminée',newbest:'Nouveau record !',tip:'Les pros regardent par-dessus l’épaule juste avant de recevoir.'}
};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let lang=new URLSearchParams(location.search).get('lang')||store.get('ttsc_lang')||((navigator.language||'tr').slice(0,2));
if(!T[lang])lang='tr';
let level=store.get('ttsc_omuz_level')||'easy'; if(!['easy','medium','hard'].includes(level))level='easy';
const tx=k=>(T[lang][k]||T.tr[k]||k);
const $=id=>document.getElementById(id);
function applyLang(){document.documentElement.lang=lang;document.querySelectorAll('[data-i]').forEach(el=>{el.textContent=tx(el.dataset.i)});$('lang').value=lang;$('lvl').value=level}

// ---------- geometry ----------
const LW=360,LH=520,ME={x:180,y:300},PASSER={x:180,y:58},ROUNDS=10,OPEN_R=46;
const LV={easy:{tm:2,opp:1,travel:3.2,glance:650,decide:3.0,sw:0,osp:70},
          medium:{tm:3,opp:2,travel:2.6,glance:420,decide:2.4,sw:.5,osp:95},
          hard:{tm:3,opp:2,travel:2.1,glance:300,decide:1.8,sw:1,osp:115}};
const rand=(a,b)=>a+Math.random()*(b-a);
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

const cv=$('cv'),ctx=cv.getContext('2d'),stage=$('stage');let S=1;
function fit(){const r=stage.getBoundingClientRect();let w=r.width,h=r.height;if(h<150)h=w*LH/LW;let cw=Math.min(w,h*LW/LH);cw=Math.max(220,cw);const ch=cw*LH/LW;
  cv.style.width=cw+'px';cv.style.height=ch+'px';const d=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(cw*d);cv.height=Math.round(ch*d);S=cv.width/LW}
window.addEventListener('resize',fit);

// ---------- state ----------
let phase='idle',tt=0,round=0,score=0,stats,tms=[],opps=[],front=null,scan=null,scanLog=[],sides=new Set(),swAt=-1,switched=false,decideStart=0,result=null,revealT=0,tapPt=null;
const NUMS=[6,8,10];

function setupRound(){
  const L=LV[level];
  for(let a=0;a<400;a++){
    tms=[];let tries=0;
    while(tms.length<L.tm&&tries<300){tries++;const p={x:rand(40,320),y:rand(350,495)};
      if(dist(p,ME)<70)continue;if(tms.every(t=>dist(t,p)>85))tms.push({x:p.x,y:p.y,vx:rand(-10,10),vy:rand(-8,8),n:NUMS[tms.length]})}
    if(tms.length<L.tm)continue;
    if(L.tm>=2&&!(tms.some(t=>t.x<165)&&tms.some(t=>t.x>195)))continue;
    break;
  }
  const order=shuffle(tms.map((_,i)=>i));
  opps=[];
  for(let i=0;i<L.opp;i++){let p;for(let k=0;k<50;k++){p={x:rand(40,320),y:rand(330,500)};if(tms.every(t=>dist(t,p)>70))break}
    opps.push({x:p.x,y:p.y,target:order[i],sp:L.osp})}
  const freeIdx=order[L.opp];
  swAt=-1;switched=false;
  if(Math.random()<L.sw&&freeIdx!==undefined){swAt=L.travel-1.05;opps.freeIdx=freeIdx}
  front={x:rand(90,270),y:rand(130,170)};
}
function markPoint(t){const dx=ME.x-t.x,dy=ME.y-t.y,l=Math.hypot(dx,dy)||1;return{x:t.x+dx/l*16,y:t.y+dy/l*16}}

function startGame(){round=0;score=0;stats={correct:0,scans:0,ontime:0};$('ov').hidden=true;nextRound()}
function nextRound(){round++;setupRound();phase='travel';tt=0;scan=null;scanLog=[];sides=new Set();result=null;tapPt=null;hud()}
function hud(){$('hRound').textContent=Math.min(round,ROUNDS)+'/'+ROUNDS;$('hScore').textContent=score}

function doScan(side){if(phase!=='travel'||scan)return;const g=LV[level].glance/1000;scan={side,start:tt,end:tt+g,cool:tt+g+.12};scanLog.push(tt);sides.add(side);stats.scans++;
  const b=side<0?$('bL'):$('bR');b.classList.add('on');setTimeout(()=>b.classList.remove('on'),LV[level].glance)}

function resolve(idx,late){
  const L=LV[level];const dtime=(performance.now()-decideStart)/1000;
  const free=tms.map(t=>opps.every(o=>dist(o,t)>OPEN_R));
  let ok=false,title;
  if(late)title=tx('late');else if(idx<0)title=tx('none');else if(free[idx]){ok=true;title=tx('good')}else title=tx('bad');
  const last=scanLog.length?scanLog[scanLog.length-1]:null;
  const ontime=last!==null&&(L.travel-last)<=1.2;
  if(ontime)stats.ontime++;
  let pts=0;if(ok){stats.correct++;pts=100+(ontime?50:0)+(sides.size===2?25:0)+Math.round(25*Math.max(0,1-dtime/L.decide))}
  const subs=[];if(!scanLog.length)subs.push(tx('noscan'));else{if(ontime)subs.push(tx('ontime'));if(sides.size===2)subs.push(tx('both'))}
  score+=pts;result={ok,idx,free,pts,title,subs};phase='reveal';revealT=0;hud();
}

function endGame(){
  phase='end';
  const key='ttsc_omuz_best_'+level;const prev=+(store.get(key)||0);const nb=score>prev;if(nb)store.set(key,score);
  const acc=Math.round(stats.correct/ROUNDS*100),sr=(stats.scans/ROUNDS).toFixed(1),ot=Math.round(stats.ontime/ROUNDS*100);
  $('ovTitle').textContent=nb?tx('newbest'):tx('end');
  $('how').hidden=true;$('endBox').hidden=false;$('endScore').textContent=score;
  $('endStats').innerHTML=`<dt>${tx('acc')}</dt><dd>${acc}%</dd><dt>${tx('scanr')}</dt><dd>${sr}</dd><dt>${tx('ontimer')}</dt><dd>${ot}%</dd><dt>${tx('best')}</dt><dd>${Math.max(prev,score)}</dd>`;
  const go=$('go');go.dataset.i='again';go.textContent=tx('again');$('ov').hidden=false;
  try{window.parent.postMessage({source:'ttsc-games',game:'omuz',level,score,accuracy:acc,scansPerBall:+sr,onTimeRate:ot},'*')}catch(e){}
}

// ---------- update ----------
function update(dt){
  const L=LV[level];
  if(phase==='travel'){
    tt+=dt;
    for(const t of tms){t.x+=t.vx*dt;t.y+=t.vy*dt;if(t.x<30||t.x>330)t.vx*=-1;if(t.y<345||t.y>500)t.vy*=-1}
    if(swAt>0&&!switched&&tt>=swAt){switched=true;const o=opps[Math.floor(Math.random()*opps.length)];o.target=opps.freeIdx;o.sp=240}
    for(const o of opps){const m=markPoint(tms[o.target]);const dx=m.x-o.x,dy=m.y-o.y,l=Math.hypot(dx,dy);if(l>1){const s=Math.min(l,o.sp*dt);o.x+=dx/l*s;o.y+=dy/l*s}}
    const fd=dist(front,PASSER);if(fd>26){front.x+=(PASSER.x-front.x)/fd*40*dt;front.y+=(PASSER.y-front.y)/fd*40*dt}
    if(scan&&tt>=scan.cool)scan=null;
    if(tt>=L.travel){phase='decide';scan=null;decideStart=performance.now()}
  }else if(phase==='decide'){
    if((performance.now()-decideStart)/1000>L.decide)resolve(-1,true);
  }else if(phase==='reveal'){
    revealT+=dt;if(revealT>1.8){if(round>=ROUNDS)endGame();else nextRound()}
  }
}

// ---------- draw ----------
function circle(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2)}
function player(p,col,label,r=11){
  ctx.fillStyle='rgba(0,0,0,.35)';circle(p.x+1.5,p.y+2.5,r);ctx.fill();
  ctx.fillStyle=col;circle(p.x,p.y,r);ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='rgba(255,255,255,.85)';ctx.stroke();
  if(label!==undefined){ctx.fillStyle='#08140f';ctx.font='700 11px Barlow, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(label,p.x,p.y+.5)}
}
function draw(){
  ctx.setTransform(S,0,0,S,0,0);
  for(let i=0;i<10;i++){ctx.fillStyle=i%2?'#14402a':'#174a31';ctx.fillRect(0,i*LH/10,LW,LH/10)}
  ctx.strokeStyle='rgba(216,232,210,.55)';ctx.lineWidth=2;
  ctx.strokeRect(8,8,LW-16,LH-16);
  ctx.beginPath();ctx.moveTo(8,ME.y);ctx.lineTo(LW-8,ME.y);ctx.stroke();
  circle(ME.x,ME.y,58);ctx.stroke();
  ctx.strokeRect(90,8,180,52);
  // floodlight
  const g=ctx.createRadialGradient(ME.x,ME.y-40,40,ME.x,ME.y,420);g.addColorStop(0,'rgba(255,201,92,.10)');g.addColorStop(1,'rgba(0,0,0,.45)');ctx.fillStyle=g;ctx.fillRect(0,0,LW,LH);

  const L=LV[level];
  player(PASSER,'#6fd3ff',4);
  if(front)player(front,'#ff6a5c');
  for(const t of tms)player(t,'#6fd3ff',t.n);
  for(const o of opps)player(o,'#ff6a5c');
  // me
  ctx.fillStyle='rgba(255,201,92,.18)';circle(ME.x,ME.y,22);ctx.fill();
  player(ME,'#ffc95c');
  ctx.fillStyle='#1d1606';ctx.font='800 9px Barlow, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';

  // ball
  let bp=null;
  if(phase==='travel'){const k=Math.min(1,tt/L.travel);bp={x:PASSER.x+(ME.x-PASSER.x)*k+Math.sin(Math.PI*k)*14,y:PASSER.y+(ME.y-14-PASSER.y)*k}}
  else if(phase==='decide')bp={x:ME.x,y:ME.y-14};
  else if(phase==='reveal'&&result){const tg=result.idx>=0?tms[result.idx]:(tapPt||{x:ME.x,y:ME.y+40});const k=Math.min(1,revealT/.45);bp={x:ME.x+(tg.x-ME.x)*k,y:ME.y-14+(tg.y-ME.y+14)*k}}
  if(bp){ctx.fillStyle='#fff';circle(bp.x,bp.y,5);ctx.fill();ctx.strokeStyle='#222';ctx.lineWidth=1;ctx.stroke()}

  // fog over the back
  if(phase==='travel'||phase==='decide'){
    ctx.save();ctx.beginPath();ctx.rect(0,ME.y-1,LW,LH-ME.y+1);ctx.clip();
    ctx.beginPath();ctx.rect(0,ME.y-1,LW,LH-ME.y+1);
    const showing=phase==='travel'&&scan&&tt<scan.end;
    if(showing){const a0=scan.side<0?Math.PI/2-.2:-.3,a1=scan.side<0?Math.PI+.3:Math.PI/2+.2;ctx.moveTo(ME.x,ME.y);ctx.arc(ME.x,ME.y,460,a0,a1);ctx.closePath()}
    ctx.fillStyle='rgba(5,12,9,.965)';ctx.fill('evenodd');
    ctx.restore();
    // keep "you" visible above fog
    player(ME,'#ffc95c');
    if(showing){ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(0,0,LW,ME.y-1)}
    if(phase==='travel'&&!showing){ctx.fillStyle='rgba(147,171,156,.55)';ctx.font='600 13px Barlow, sans-serif';ctx.textAlign='center';ctx.fillText('?',ME.x-90,ME.y+110);ctx.fillText('?',ME.x+90,ME.y+110)}
  }
  if(phase==='decide'){
    const L2=LV[level];const left=Math.max(0,1-(performance.now()-decideStart)/1000/L2.decide);
    ctx.fillStyle='rgba(8,20,15,.85)';ctx.fillRect(20,ME.y+20,LW-40,40);
    ctx.fillStyle='#ffc95c';ctx.fillRect(20,ME.y+56,(LW-40)*left,4);
    ctx.fillStyle='#eef4ea';ctx.font='800 18px "Barlow Condensed", sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(tx('decide').toUpperCase(),LW/2,ME.y+39);
  }
  if(phase==='reveal'&&result){
    for(const o of opps){ctx.strokeStyle='rgba(255,106,92,.6)';ctx.setLineDash([4,4]);ctx.lineWidth=1.5;circle(o.x,o.y,OPEN_R);ctx.stroke();ctx.setLineDash([])}
    tms.forEach((t,i)=>{if(result.free[i]){ctx.strokeStyle='#7ee08a';ctx.lineWidth=3;circle(t.x,t.y,17);ctx.stroke()}});
    if(tapPt&&result.idx<0){ctx.strokeStyle='#ff6a5c';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(tapPt.x-8,tapPt.y-8);ctx.lineTo(tapPt.x+8,tapPt.y+8);ctx.moveTo(tapPt.x+8,tapPt.y-8);ctx.lineTo(tapPt.x-8,tapPt.y+8);ctx.stroke()}
    ctx.fillStyle='rgba(8,20,15,.9)';ctx.fillRect(16,ME.y-120,LW-32,84);
    ctx.fillStyle=result.ok?'#7ee08a':'#ff6a5c';ctx.font='800 26px "Barlow Condensed", sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(result.title.toUpperCase()+(result.ok?'  +'+result.pts:''),LW/2,ME.y-96);
    ctx.fillStyle='#d7e3d9';ctx.font='600 14px Barlow, sans-serif';ctx.fillText(result.subs.join(' · '),LW/2,ME.y-62);
  }
}

let lastT=performance.now();
function loop(now){const dt=Math.min(.05,(now-lastT)/1000);lastT=now;update(dt);draw();requestAnimationFrame(loop)}

// ---------- input ----------
function toL(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*LW,y:(e.clientY-r.top)/r.height*LH}}
cv.addEventListener('pointerdown',e=>{
  const p=toL(e);
  if(phase==='travel'){doScan(p.x<LW/2?-1:1)}
  else if(phase==='decide'){
    if(p.y<ME.y-10)return;
    let best=-1,bd=60;tms.forEach((t,i)=>{const d=dist(t,p);if(d<bd){bd=d;best=i}});
    tapPt=p;resolve(best,false);
  }
});
$('bL').addEventListener('pointerdown',e=>{e.preventDefault();doScan(-1)});
$('bR').addEventListener('pointerdown',e=>{e.preventDefault();doScan(1)});
window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')doScan(-1);if(e.key==='ArrowRight'||e.key==='d')doScan(1)});
$('go').addEventListener('click',startGame);
$('lang').addEventListener('change',e=>{lang=e.target.value;store.set('ttsc_lang',lang);applyLang()});
$('lvl').addEventListener('change',e=>{level=e.target.value;store.set('ttsc_omuz_level',level);if(phase!=='idle'&&phase!=='end'){phase='idle';$('how').hidden=false;$('endBox').hidden=true;$('ovTitle').textContent='Omuz';const go=$('go');go.dataset.i='start';go.textContent=tx('start');$('ov').hidden=false;round=0;score=0;hud()}});

applyLang();fit();setupRound();hud();requestAnimationFrame(loop);
</script>
