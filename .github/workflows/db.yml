name: Update database

# Applies supabase/schema.sql and the season fixtures to the Supabase database,
# so nobody has to paste SQL by hand. Both files are safe to run again and again.
#
# Uses one of two repository secrets:
#   SUPABASE_TOKEN   – a Supabase access token (supabase.com/dashboard/account/tokens); preferred
#   SUPABASE_DB_URL  – the Session pooler connection address with the database password
# Without either, the job only prints a notice.

on:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/db.yml']
  workflow_dispatch:
    inputs:
      season_data:
        description: 'Optional: season stats as base64 JSON (kind season_stats). Not stored in the repository.'
        required: false
        default: ''

concurrency:
  group: database
  cancel-in-progress: false

env:
  PROJECT_REF: cmzukfpfzgugjatawwwj

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply schema and fixtures
        env:
          TOKEN: ${{ secrets.SUPABASE_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_TOKEN }}
          SEASON_DATA: ${{ github.event.inputs.season_data }}
          DB: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          sql_api() {   # run SQL through the Supabase Management API, print the JSON result
            local body code
            body=$(jq -Rs '{query: .}' "$1")
            code=$(curl -sS -o /tmp/out.json -w '%{http_code}' -X POST \
              "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
              -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data "$body")
            if [ "$code" -ge 300 ]; then echo "::error::Supabase answered $code: $(head -c 500 /tmp/out.json)"; exit 1; fi
            cat /tmp/out.json
          }
          printf "select (select count(*) from information_schema.tables where table_schema = 'public') as tables,\n (select count(*) from public.events where type = 'match') as matches,\n (select count(*) from public.profiles) as people,\n (select count(*) from public.season_stats) as season_rows;\n" > /tmp/summary.sql

          if [ -n "$TOKEN" ]; then
            echo "Using the Supabase access token"
            sql_api supabase/schema.sql >/dev/null
            sql_api supabase/fixtures-2026-27.sql >/dev/null
            if [ -n "$SEASON_DATA" ]; then
              # build an upsert from the input; names are never printed
              python3 - <<'PY' > /tmp/season.sql
          import os, json, base64
          raw = os.environ['SEASON_DATA'].strip(); raw += '=' * (-len(raw) % 4)
          d = json.loads(base64.urlsafe_b64decode(raw))
          assert d.get('kind') == 'season_stats'
          q = lambda v: "'" + str(v).replace("'", "''") + "'"
          vals = ",\n".join(f"({q(d['season'])}, {q(n)}, {int(a)}, {int(m)}, {int(g)}, {q(d.get('source', ''))})" for n, a, m, g in d['rows'])
          print("insert into public.season_stats (season, name, apps, minutes, goals, source) values\n" + vals +
                "\non conflict (season, name) do update set apps = excluded.apps, minutes = excluded.minutes, goals = excluded.goals, source = excluded.source, updated_on = current_date;")
          PY
              sql_api /tmp/season.sql >/dev/null
              echo "Season stats loaded: $(python3 -c "import os,json,base64;r=os.environ['SEASON_DATA'].strip();r+='='*(-len(r)%4);print(len(json.loads(base64.urlsafe_b64decode(r))['rows']))") rows"
            fi
            # push notifications: keys are created once and stay in Supabase (never printed, never in the repo)
            echo "select count(*) as n from public.app_config where key = 'vapid_public';" > /tmp/q.sql
            if [ "$(sql_api /tmp/q.sql | jq -r '.[0].n')" = "0" ]; then
              keys=$(npx -y web-push@3.6.7 generate-vapid-keys --json)
              pub=$(jq -r .publicKey <<<"$keys"); priv=$(jq -r .privateKey <<<"$keys"); hook=$(openssl rand -hex 24)
              echo "::add-mask::$priv"; echo "::add-mask::$hook"
              supabase secrets set --project-ref "$PROJECT_REF" VAPID_PUBLIC="$pub" VAPID_PRIVATE="$priv" HOOK_SECRET="$hook" VAPID_SUBJECT="mailto:info@ttscbuchen.de" >/dev/null
              printf "insert into private.app_secrets values ('hook', '%s'), ('function_url', 'https://%s.supabase.co/functions/v1/notify') on conflict (key) do update set value = excluded.value;\ninsert into public.app_config values ('vapid_public', '%s') on conflict (key) do update set value = excluded.value;\n" "$hook" "$PROJECT_REF" "$pub" > /tmp/keys.sql
              sql_api /tmp/keys.sql >/dev/null; rm -f /tmp/keys.sql
              echo "Push keys created"
            fi
            sql_api supabase/push.sql >/dev/null
            supabase functions deploy notify --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
            { echo "### Database updated"; sql_api /tmp/summary.sql | jq -r '.[0] | to_entries[] | "- \(.key): \(.value)"'; } >> "$GITHUB_STEP_SUMMARY"
            cat "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ -z "$DB" ]; then echo "::notice::No SUPABASE_TOKEN or SUPABASE_DB_URL secret yet – nothing applied."; exit 0; fi
          sudo apt-get install -y -qq postgresql-client >/dev/null
          # Split the address by hand so a password with @ # / ? % works without URL-encoding.
          eval "$(python3 - <<'PY'
          import os, shlex
          rest = os.environ['DB'].strip().split('://', 1)[1]
          cred, hostpart = rest.rsplit('@', 1)
          user, pw = cred.split(':', 1)
          hp, _, db = hostpart.partition('/')
          host, _, port = hp.partition(':')
          for k, v in dict(PGUSER=user, PGPASSWORD=pw, PGHOST=host, PGPORT=port or '5432', PGDATABASE=(db.split('?')[0] or 'postgres'), PGSSLMODE='require').items():
              print(f'export {k}={shlex.quote(v)}')
          PY
          )"
          echo "::add-mask::$PGPASSWORD"
          echo "Using the connection address: user $PGUSER, host $PGHOST"
          psql -v ON_ERROR_STOP=1 -q -f supabase/schema.sql
          psql -v ON_ERROR_STOP=1 -q -f supabase/fixtures-2026-27.sql
          { echo "### Database updated"; psql -tA -F ': ' -f /tmp/summary.sql; } >> "$GITHUB_STEP_SUMMARY"
