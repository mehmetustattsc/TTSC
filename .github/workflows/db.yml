name: Update database

# Applies supabase/schema.sql and the season fixtures to the Supabase database,
# so nobody has to paste SQL by hand. Both files are safe to run again and again.
# Needs the repository secret SUPABASE_DB_URL (Supabase → Connect → Session pooler URI,
# with the database password filled in). Without it the job only prints a notice.

on:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/db.yml']
  workflow_dispatch:

concurrency:
  group: database
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply schema and fixtures
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DB" ]; then
            echo "::notice::SUPABASE_DB_URL is not set yet – nothing applied."
            exit 0
          fi
          sudo apt-get install -y -qq postgresql-client >/dev/null
          # Split the address by hand (first ':' after the user, last '@' before the host), so a password
          # with characters like @ # / ? % works without URL-encoding. The password goes in PGPASSWORD.
          eval "$(python3 - <<'PY'
          import os, shlex
          raw = os.environ['DB'].strip()
          rest = raw.split('://', 1)[1]
          cred, hostpart = rest.rsplit('@', 1)
          user, pw = cred.split(':', 1)
          hp, _, db = hostpart.partition('/')
          host, _, port = hp.partition(':')
          db = db.split('?', 1)[0] or 'postgres'
          for k, v in dict(PGUSER=user, PGPASSWORD=pw, PGHOST=host, PGPORT=port or '5432', PGDATABASE=db, PGSSLMODE='require').items():
              print(f'export {k}={shlex.quote(v)}')
          PY
          )"
          echo "user: $PGUSER | host: $PGHOST | port: $PGPORT | db: $PGDATABASE | password length: ${#PGPASSWORD}"
          echo "::add-mask::$PGPASSWORD"
          DB=""
          for i in 1 2 3; do psql -tAc 'select 1' >/dev/null 2>&1 && break; echo "connection attempt $i failed, waiting…"; sleep 15; done
          psql -v ON_ERROR_STOP=1 -q -f supabase/schema.sql
          psql -v ON_ERROR_STOP=1 -q -f supabase/fixtures-2026-27.sql
          echo "### Database updated" >> "$GITHUB_STEP_SUMMARY"
          psql -tA -c "select 'tables: ' || count(*) from information_schema.tables where table_schema = 'public'" >> "$GITHUB_STEP_SUMMARY"
          psql -tA -c "select 'matches: ' || count(*) from public.events where type = 'match'" >> "$GITHUB_STEP_SUMMARY"
          psql -tA -c "select 'people in the app: ' || count(*) from public.profiles" >> "$GITHUB_STEP_SUMMARY"
