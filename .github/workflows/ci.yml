name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Translations complete (tr, de, en, fr)
        run: npm run test:i18n && npm run test:notify
      - run: npx playwright install --with-deps chromium
      - name: Browser smoke test (all roles, main flows, privacy)
        run: mkdir -p tests/shots && npm run test:smoke
      - name: Server test (real Postgres + schema + REST, several people at once)
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o pgrst.tar.xz https://github.com/PostgREST/postgrest/releases/download/v12.2.3/postgrest-v12.2.3-linux-static-x64.tar.xz && tar xJf pgrst.tar.xz
          PG_BIN=$(ls -d /usr/lib/postgresql/*/bin | tail -1) POSTGREST=./postgrest npm run test:server

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the site files
        run: |
          mkdir _site
          cp -r index.html datenschutz.html afis.html manifest.webmanifest sw.js css js assets data games _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
