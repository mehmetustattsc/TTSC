name: Upload a file to the website

# Helper: sends a file to a one-time upload link of the website's media library (Easy MCP AI),
# because the assistant's own network cannot reach ttscbuchen.de. The file comes from a short-lived
# branch that is deleted right after.
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'One-time upload link'
        required: true
      ref:
        description: 'Branch that holds the file'
        required: true
      path:
        description: 'File path on that branch'
        required: true

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}
      - name: Upload
        env:
          URL: ${{ github.event.inputs.url }}
          FILE: ${{ github.event.inputs.path }}
        run: |
          echo "::add-mask::$URL"
          echo "bytes: $(stat -c %s "$FILE")"
          curl -sS --fail-with-body -T "$FILE" "$URL"; echo
