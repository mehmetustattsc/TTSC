name: fussball.de import

# Reads the TTSC pages on fussball.de (league table, results, squad statistics) and stores them
# in the Supabase database, then puts the latest result on the front page of ttscbuchen.de.
# Runs every morning; can also be started by hand.
on:
  schedule:
    - cron: '17 4 * * *'      # every day 05:17 / 06:17 in Buchen
  workflow_dispatch:
    inputs:
      mode:
        description: 'probe = page structure, dry = read and count only, import = store the data'
        default: import

concurrency:
  group: fussball
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        if: github.event.inputs.mode == 'probe'
        run: pip install -q fonttools pillow && python3 tools/fussball_probe.py
      - name: Import
        if: github.event.inputs.mode != 'probe'
        env:
          SUPABASE_TOKEN: ${{ secrets.SUPABASE_TOKEN }}
        run: |
          pip install -q fonttools
          if [ "${{ github.event.inputs.mode }}" = "dry" ]; then python3 tools/fussball_import.py --dry; else python3 tools/fussball_import.py; fi
      - name: Latest result on the website
        if: github.event.inputs.mode != 'probe' && github.event.inputs.mode != 'dry'
        env:
          SUPABASE_TOKEN: ${{ secrets.SUPABASE_TOKEN }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: python3 tools/wp_result.py
      - uses: actions/upload-artifact@v4
        if: github.event.inputs.mode != 'probe' && github.event.inputs.mode != 'dry'
        with: { name: result-block, path: result-block.html, retention-days: 3, if-no-files-found: ignore }
